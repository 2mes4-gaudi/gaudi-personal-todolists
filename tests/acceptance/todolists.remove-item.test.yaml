id: todolists.remove-item
description: "L'usuari treu una cosa de la llista (amb confirmacio)"
prompt: "Treu la llet de la llista"
setup:
  - node dist/bin.js todo list-create "Compra setmanal" --json > /tmp/list.json
  - node -e "console.log(require('/tmp/list.json').list.id)" > /tmp/list_id
  - node dist/bin.js todo item-add "$(cat /tmp/list_id)" "Llet" --json > /tmp/item.json
  - node -e "console.log(require('/tmp/item.json').item.id)" > /tmp/item_id
action: >-
  node dist/bin.js todo item-remove "$(cat /tmp/item_id)" --yes --json
expected:
  exit: 0
  stdout:
    jsonEquals:
      "deleted": true
