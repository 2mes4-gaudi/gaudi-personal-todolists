id: todolists.add-items
description: "L'usuari afegeix coses a una llista i hi apareixen com a pendents"
prompt: "Afegeix pa i llet a la llista Compra setmanal"
setup:
  - node dist/bin.js todo list-create "Compra setmanal" --json > /tmp/list.json
  - node -e "console.log(require('/tmp/list.json').list.id)" > /tmp/list_id
  - node dist/bin.js todo item-add "$(cat /tmp/list_id)" "Pa" --json > /dev/null
action: >-
  node dist/bin.js todo item-add "$(cat /tmp/list_id)" "Llet" --json
expected:
  exit: 0
  stdout:
    contains:
      - '"text": "Llet"'
    jsonEquals:
      "item.done": false
